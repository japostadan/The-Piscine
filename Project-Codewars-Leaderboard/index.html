<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Codewars Leaderboard</title>
  </head>
  <body>
    <h1>Codewars Leaderboard</h1>

    <form id="user-form">
      <label for="usernames">Enter usernames</label>
      <input id="usernames" type="text" required />
      <button type="submit">Load Leaderboard</button>
    </form>

    <div id="error-message" role="alert"></div>

    <select id="language-select"></select>

    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Clan</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
